stages:
  - test
  - build

variables:
  PNPM_VERSION: "10.32.1"
  DOCKER_TLS_CERTDIR: "/certs"

# ---------- Node jobs: lint / type-check / test ----------
.node:
  image: node:22-alpine
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    # @omni/sdk phải build trước → có dist/types cho type-check & test.
    - pnpm --filter @omni/sdk build

lint-typecheck:
  extends: .node
  stage: test
  script:
    - pnpm run check # biome check . && turbo run type-check

test:
  extends: .node
  stage: test
  script:
    - pnpm run test # turbo run test (jest server)

# ---------- Docker: build & push lên GitLab Container Registry ----------
.docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  # Chỉ build image trên nhánh mặc định + tag (đổi rules nếu muốn build mỗi nhánh).
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build-server:
  extends: .docker
  script:
    - IMG="$CI_REGISTRY_IMAGE/server"
    - docker build -f apps/server/Dockerfile -t "$IMG:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMG:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMG:$CI_COMMIT_SHORT_SHA" "$IMG:latest"
        docker push "$IMG:latest"
      fi

build-frontend:
  extends: .docker
  script:
    - IMG="$CI_REGISTRY_IMAGE/frontend"
    - docker build -f apps/frontend-app/Dockerfile
      --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL"
      -t "$IMG:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMG:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMG:$CI_COMMIT_SHORT_SHA" "$IMG:latest"
        docker push "$IMG:latest"
      fi
