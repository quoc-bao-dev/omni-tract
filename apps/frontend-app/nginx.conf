server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Asset Next có hash → cache dài.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Static export: thử file, .html, thư mục, fallback index.html (client routing).
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
