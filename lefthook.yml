pre-commit:
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,json,jsonc}'
      # check = format + lint + organize imports + sort Tailwind class (--unsafe cho class sort)
      run: pnpm exec biome check --write --unsafe --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

# Guided commit: chạy `pnpm commit` (commitizen wizard) — KHÔNG auto-wizard ở
# prepare-commit-msg để tránh double-fire khi cz/`-m` đã có message sẵn.
# Mọi commit (cả `git commit -m`) vẫn được commit-msg validate bên dưới.

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
