pre-commit:
  parallel: false
  commands:
    1_lint:
      priority: 1
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    2_format:
      priority: 2
      glob: '*.{js,jsx,ts,tsx,json,css,md,yaml,yml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

# Guided commit: chạy `pnpm commit` (commitizen wizard) — KHÔNG auto-wizard ở
# prepare-commit-msg để tránh double-fire khi cz/`-m` đã có message sẵn.
# Mọi commit (cả `git commit -m`) vẫn được commit-msg validate bên dưới.

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
